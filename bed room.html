<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home - Bedroom</title>

    <link rel="stylesheet" href="ALL ROOMs CSS.css">
</head>
<body>

    <nav>
        <h2>Smart Home</h2>

        <ul>
            <li><a href="living room.html">Living Room</a></li>
            <li><a href="bed room.html">Bedroom</a></li>
            <li><a href="kichen.html">Kitchen</a></li>
            <li><a href="bath room.html">Bathroom</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>


    <div class="container">

        <h1 class="title">Bedroom Control</h1>

        <div class="cards">


            <div class="card">
                <h3> Bedroom Light</h3>

                <button>Turn ON</button>
                <button>Turn OFF</button>

                <p><strong>Brightness</strong></p>
                <input type="range" min="0" max="100" value="70">
            </div>


            <div class="card">
                <h3> Air Conditioner</h3>

                <button>Turn ON</button>
                <button>Turn OFF</button>

                <p><strong>Temperature</strong></p>

                <select>
                    <option>16°C</option>
                    <option>18°C</option>
                    <option selected>22°C</option>
                    <option>24°C</option>
                    <option>26°C</option>
                    <option>28°C</option>
                </select>
            </div>

  
            <div class="card">
                <h3> Ceiling Fan</h3>

                <button>Turn ON</button>
                <button>Turn OFF</button>

                <p><strong>Speed</strong></p>

                <select>
                    <option>Low</option>
                    <option selected>Medium</option>
                    <option>High</option>
                </select>
            </div>


            <div class="card">
                <h3> Smart Curtains</h3>

                <button>Open</button>
                <button>Close</button>

                <p><strong>Opening Level</strong></p>

                <input type="range" min="0" max="100" value="50">
            </div>

        </div>

    </div>



</body>
</html>
