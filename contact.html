<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Smart Home</title>

<link rel="stylesheet" href="contact.css">
</head>
<body>

    <nav>
        <h2>Smart Home</h2>

        <ul>
            <li><a href="living room.html">Living Room</a></li>
            <li><a href="bed room.html">Bedroom</a></li>
            <li><a href="kichen.html">Kitchen</a></li>
            <li><a href="bath room.html">Bathroom</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>


    <div class="container">

        <h1 class="title">Contact Us</h1>

        <div class="card">

            <form>

                <label><strong>Full Name</strong></label><br><br>
                <input type="text" placeholder="Enter your full name" required>

                <br><br>

                <label><strong>Email Address</strong></label><br><br>
                <input type="email" placeholder="Enter your email" required>

                <br><br>

                <label><strong>Phone Number</strong></label><br><br>
                <input type="tel" placeholder="Enter your phone number">

                <br><br>

                <label><strong>Subject</strong></label><br><br>
                <input type="text" placeholder="Enter the subject">

                <br><br>

                <label><strong>Message</strong></label><br><br>
                <textarea rows="6" placeholder="Write your message here..." required></textarea>

                <br><br>

                <button type="submit">Send Message</button>

            </form>

        </div>

    </div>



</body>
</html>
