<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home - Kitchen</title>

    <link rel="stylesheet" href="ALL ROOMs CSS.css">
</head>
<body>

    <nav>
        <h2>Smart Home</h2>

        <ul>
            <li><a href="living room.html">Living Room</a></li>
            <li><a href="bed room.html">Bedroom</a></li>
            <li><a href="kichen.html">Kitchen</a></li>
            <li><a href="bath room.html">Bathroom</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">

        <h1 class="title">Kitchen Control</h1>

        <div class="cards">


            <div class="card">
                <h3> Kitchen Lights</h3>

                <button>Turn ON</button>
                <button>Turn OFF</button>

                <p><strong>Brightness</strong></p>
                <input type="range" min="0" max="100" value="80">
            </div>


            <div class="card">
                <h3> Refrigerator</h3>

                <button>Turn ON</button>
                <button>Turn OFF</button>

                <p><strong>Temperature</strong></p>

                <select>
                    <option>-18°C</option>
                    <option>-15°C</option>
                    <option>-10°C</option>
                    <option>0°C</option>
                    <option selected>4°C</option>
                </select>
            </div>


            <div class="card">
                <h3> Smart Oven</h3>

                <button>Turn ON</button>
                <button>Turn OFF</button>

                <p><strong>Cooking Temperature</strong></p>

                <select>
                    <option>100°C</option>
                    <option>150°C</option>
                    <option selected>180°C</option>
                    <option>200°C</option>
                    <option>220°C</option>
                    <option>250°C</option>
                </select>
            </div>


            <div class="card">
                <h3> Exhaust Fan</h3>

                <button>Turn ON</button>
                <button>Turn OFF</button>

                <p><strong>Fan Speed</strong></p>

                <select>
                    <option>Low</option>
                    <option selected>Medium</option>
                    <option>High</option>
                </select>
            </div>

        </div>

    </div>



</body>
</html>
