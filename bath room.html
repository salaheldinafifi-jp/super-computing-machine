<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home - Bathroom</title>

    <link rel="stylesheet" href="ALL ROOMs CSS.css">
</head>
<body>

    <nav>
        <h2>Smart Home</h2>

        <ul>
            <li><a href="living room.html">Living Room</a></li>
            <li><a href="bed room.html">Bedroom</a></li>
            <li><a href="kichen.html">Kitchen</a></li>
            <li><a href="bath room.html">Bathroom</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

  
    <div class="container">

        <h1 class="title">Bathroom Control</h1>

        <div class="cards">


            <div class="card">
                <h3> Bathroom Light</h3>

                <button>Turn ON</button>
                <button>Turn OFF</button>

                <p><strong>Brightness</strong></p>
                <input type="range" min="0" max="100" value="80">
            </div>


            <div class="card">
                <h3> Water Heater</h3>

                <button>Turn ON</button>
                <button>Turn OFF</button>

                <p><strong>Water Temperature</strong></p>

                <select>
                    <option>30°C</option>
                    <option>35°C</option>
                    <option selected>40°C</option>
                    <option>45°C</option>
                    <option>50°C</option>
                    <option>55°C</option>
                </select>
            </div>


            <div class="card">
                <h3> Exhaust Fan</h3>

                <button>Turn ON</button>
                <button>Turn OFF</button>

                <p><strong>Fan Speed</strong></p>

                <select>
                    <option>Low</option>
                    <option selected>Medium</option>
                    <option>High</option>
                </select>
            </div>


            <div class="card">
                <h3>Smart Shower</h3>

                <button>Start</button>
                <button>Stop</button>

                <p><strong>Water Flow</strong></p>
                <input type="range" min="0" max="100" value="60">
            </div>

        </div>

    </div>




</body>
</html>
